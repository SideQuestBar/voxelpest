<!doctype html>
<!-- Cloudflare Pages serves this with a 404 for any missing file. Without it Pages would answer every unknown path
     with index.html and a 200, and the viewer reads a missing tile's 404 as an empty tile. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Budapest in voxels</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b2028; color: #e9e4da;
           font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 0 16px; }
    a { color: #f2c46d; }
  </style>
</head>
<body>
  <p>Not found · Nem található<br><a href="/">Budapest in voxels</a></p>
</body>
</html>
