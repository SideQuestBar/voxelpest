<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Budapest in voxels</title>
  <meta name="description" content="Central Budapest in half-metre voxels, built from open data: fly over it, walk its streets, drive a taxi. Made by SideQuest Bar." />
  <meta name="theme-color" content="#c9d3dc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
  <style>
    /* the loading screen, here so it shows before the code has loaded */
    html, body { margin: 0; background: #c9d3dc; }
    #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      background: linear-gradient(#c9d3dc, #dde1dd 55%, #ebe4d6); color: #1d2328; font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .6s ease, visibility 0s .6s; }
    #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #loading .ld { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(560px, 86vw); margin-top: -4vh; }
    #loading canvas { display: block; max-width: 100%; image-rendering: pixelated; }
    #loading h1 { margin: 6px 0 0; font-size: clamp(22px, 5.4vw, 30px); letter-spacing: -0.01em; text-align: center; }
    #loading h1 em { font-style: normal; font-weight: 400; opacity: .8; }
    #loading .ld-bar { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: rgba(29, 35, 40, .12); overflow: hidden; }
    #loading .ld-bar i { display: block; height: 100%; background: #b5513f; border-radius: 3px; transform: scaleX(0); transform-origin: left;
      transition: transform .25s ease-out; }
    #loading.failed .ld-bar i { background: #8a2a1e; }
    #loading-text { min-height: 18px; opacity: .72; font-variant-numeric: tabular-nums; text-align: center; padding: 0 16px; }
    #loading .ld-by { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px;
      color: inherit; text-decoration: none; opacity: .8; }
    #loading .ld-by img { height: 26px; }
    #loading .ld-by b { color: #282949; }
    @media (max-height: 420px) { #loading .ld { gap: 8px; width: min(520px, 70vw); margin-top: -24px; } #loading .ld-by { bottom: calc(8px + env(safe-area-inset-bottom, 0px)); } }
  </style>
</head>

        'WWWWWWWWWWWWWWWWWwWssssWWWWWWWwwWWWssssWWWWWWWWwWWWWWWWWWWWwwWWW',
      ];
      const COL = { W: '#3d6f8a', w: '#6d9db5', H: '#73925a', h: '#5d7c47', S: '#ece0c2', s: '#cdb994', R: '#b5513f', r: '#93412f',
        G: '#6aa893', g: '#4e8a75', D: '#2e3840', Y: '#ffc948' };
      const root = document.getElementById('loading'), cv = root.querySelector('canvas'), g = cv.getContext('2d');
      const bar = root.querySelector('.ld-bar'), fill = bar.firstElementChild, text = document.getElementById('loading-text');
      // the language, by i18n.ts's rule (?lang=, the saved choice, then the browser's), for the words shown before it loads
      let lang = new URLSearchParams(location.search).get('lang');
      if (lang !== 'en' && lang !== 'hu') {
        try { lang = localStorage.getItem('voxelpest-lang'); } catch { lang = null; }
        if (lang !== 'en' && lang !== 'hu') lang = (navigator.languages || [navigator.language]).some((l) => /^hu/i.test(l)) ? 'hu' : 'en';
      }
      if (lang === 'hu') {
        document.documentElement.lang = 'hu';
        root.querySelector('[data-t=titleTail]').textContent = 'voxelekben';
        root.querySelector('[data-t=sqMadeBy]').textContent = 'készítette';
        text.textContent = 'Töltődik a térkép…';
      }
      // bottom up, roughly left to right: the Parliament's spire is among the last
      const blocks = [];
      ART.forEach((row, y) => [...row].forEach((c, x) => { if (c !== ' ') blocks.push({ x, y, c, k: ART.length - y + Math.random() * 3 + x / 40, t: 0 }); }));
      blocks.sort((a, b) => a.k - b.k);
      const n = blocks.length, DROP = 260, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const baked = document.createElement('canvas'), bg = baked.getContext('2d');
      let s = 1, placed = 0, settled = 0, target = 0, pct = -1, finish = null, failed = false;
      const t0 = performance.now();
      let last = t0;
      const draw = (c, b, dy) => {
        const e = Math.max(1, s >> 3), q = s - e, x = b.x * s, y = b.y * s + dy;
        c.fillStyle = COL[b.c]; c.fillRect(x, y, q, q);
        c.fillStyle = 'rgba(255,255,255,.22)'; c.fillRect(x, y, q, e);
        c.fillStyle = 'rgba(0,0,0,.13)'; c.fillRect(x, y + q - e, q, e);
      };
      const size = () => {
        const dpr = Math.min(devicePixelRatio || 1, 3), w = Math.min(560, innerWidth * 0.86, innerHeight * 1.1);
        s = Math.max(2, Math.floor((w * dpr) / ART[0].length));
        cv.width = baked.width = s * ART[0].length;
        cv.height = baked.height = s * ART.length;
        cv.style.width = `${cv.width / dpr}px`;
        for (let i = 0; i < settled; i++) draw(bg, blocks[i], 0);
      };
      size();
      addEventListener('resize', size);
      const tick = (now) => {
        const dt = Math.min(Math.max(now - last, 16), 1000);
        last = now;
        if (!finish && !failed) target = Math.max(target, 0.1 * (1 - Math.exp(-(now - t0) / 2500)));
        // laid at a pace in time, not per frame: the whole skyline in 1.5 s at most, the rest in 0.45 s once done
        const want = Math.round(target * n);
        for (let k = Math.ceil((n * dt) / (finish ? 450 : 1500)); placed < want && k > 0; k--) blocks[placed++].t = now;
        while (settled < placed && (still || dt >= DROP || now - blocks[settled].t >= DROP)) draw(bg, blocks[settled++], 0);
        g.clearRect(0, 0, cv.width, cv.height);
        g.drawImage(baked, 0, 0);
        for (let i = settled; i < placed; i++) {
          const e = Math.min(1, (now - blocks[i].t) / DROP);
          g.globalAlpha = e;
          draw(g, blocks[i], -(1 - e) * (1 - e) * s * 3);
        }
        if (placed < n && !finish && !failed) {  // the next block, waiting to be laid
          g.globalAlpha = still ? 0.3 : 0.22 + 0.2 * Math.sin(now / 150);
          draw(g, blocks[placed], 0);
        }
        g.globalAlpha = 1;
        const p = Math.round((100 * placed) / n);
        if (p !== pct) { pct = p; fill.style.transform = `scaleX(${placed / n})`; bar.setAttribute('aria-valuenow', String(p)); }
        if (finish && settled === n) {
          root.classList.add('hidden');
          removeEventListener('resize', size);
          setTimeout(() => { root.remove(); finish(); }, 600);
          return;
        }
        if (!failed) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      window.bvLoader = {
        progress(p, label) {
          target = Math.max(target, Math.min(p, 1));
          if (label && text.textContent !== label) text.textContent = label;
        },
        done(then) {
          if (finish) return;
          finish = then || (() => {});
          target = 1;
        },
        fail(label) {
          failed = true;
          root.classList.add('failed');
          text.textContent = label;
        },
      };
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
